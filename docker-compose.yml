version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: faulttrace-db
    environment:
      POSTGRES_USER: faulttrace_user
      POSTGRES_PASSWORD: faulttrace_password
      POSTGRES_DB: faulttrace_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faulttrace_user -d faulttrace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: faulttrace-backend
    environment:
      DATABASE_URL: postgresql://faulttrace_user:faulttrace_password@db:5432/faulttrace_db
      ENABLE_LIVE_WEATHER: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -m scripts.seed_data &&
             python -m scripts.train_model &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: faulttrace-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
